name: Autograding Tests
'on':
  - push
  - workflow_dispatch
  - repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: "average fixed (15)"
        id: average
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "average fixed"
          setup-command: ''
          command: sh .github/grade.sh AverageTest
          timeout: 5
          max-score: 15
      - name: "countVowels fixed (10)"
        id: countvowels
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "countVowels fixed"
          setup-command: ''
          command: sh .github/grade.sh CountVowelsTest
          timeout: 5
          max-score: 10
      - name: "isLeapYear fixed (20)"
        id: isleapyear
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "isLeapYear fixed"
          setup-command: ''
          command: sh .github/grade.sh IsLeapYearTest
          timeout: 5
          max-score: 20
      - name: "sumTo fixed (15)"
        id: sumto
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "sumTo fixed"
          setup-command: ''
          command: sh .github/grade.sh SumToTest
          timeout: 5
          max-score: 15
      - name: "sameWord fixed (15)"
        id: sameword
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "sameWord fixed"
          setup-command: ''
          command: sh .github/grade.sh SameWordTest
          timeout: 5
          max-score: 15
      - name: "maxOf fixed (25)"
        id: maxof
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "maxOf fixed"
          setup-command: ''
          command: sh .github/grade.sh MaxOfTest
          timeout: 5
          max-score: 25
      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          AVERAGE_RESULTS: "${{ steps.average.outputs.result }}"
          COUNTVOWELS_RESULTS: "${{ steps.countvowels.outputs.result }}"
          ISLEAPYEAR_RESULTS: "${{ steps.isleapyear.outputs.result }}"
          SUMTO_RESULTS: "${{ steps.sumto.outputs.result }}"
          SAMEWORD_RESULTS: "${{ steps.sameword.outputs.result }}"
          MAXOF_RESULTS: "${{ steps.maxof.outputs.result }}"
        with:
          runners: average,countvowels,isleapyear,sumto,sameword,maxof
